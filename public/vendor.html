<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vendor Portal — Ajanta Appliances</title>
<link rel="icon" type="image/png" href="/logo-mark.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<!--
  Purchase FMS vendor page (2026-10-03; redesigned 2026-10-17). Opened by a
  vendor login (role 'vendor' — /app redirects here). Shows the PO lines still
  due from this vendor and the goods Ajanta sent back for replacement, and lets
  the vendor post a status update per line; see "PURCHASE FMS — VENDOR PAGE"
  in server.js. Vendor tokens can only reach /api/me and /api/vendor/*.
  Wide screens: one table per PO. Phones: one card per item.
-->
<style>
:root{
  --primary:#1d4ed8; --primary-dark:#1e3a8a; --primary-light:#eff6ff;
  --success:#047857; --success-bg:#ecfdf5; --warning:#b45309; --warning-bg:#fffbeb; --danger:#b91c1c; --danger-bg:#fef2f2;
  --g50:#f8fafc; --g100:#f1f5f9; --g200:#e2e8f0; --g300:#cbd5e1; --g400:#94a3b8; --g500:#64748b; --g600:#475569; --g700:#334155; --g900:#0f172a;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;background:var(--g50);color:var(--g900);font-size:14px;-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* Top bar */
.top{background:#fff;border-bottom:1px solid var(--g200);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.top img{height:36px;width:36px;object-fit:contain}
.brand{flex:1;min-width:0;line-height:1.25}
.brand b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12px;color:var(--g500)}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--g200);background:#fff;color:var(--g700);border-radius:8px;font:600 13px 'Inter';cursor:pointer}
.tbtn:hover{background:var(--g50);border-color:var(--g300)}

.page{padding-top:24px;padding-bottom:40px}
.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-title h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
.page-title p{margin:4px 0 0;color:var(--g500);font-size:13px}
.page-title .upd{font-size:12px;color:var(--g400);white-space:nowrap}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.kpi .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi .ic svg.i{width:20px;height:20px}
.kpi b{display:block;font-size:24px;font-weight:800;line-height:1}
.kpi span{display:block;font-size:12.5px;color:var(--g500);margin-top:5px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--g200);margin-bottom:18px}
.tab{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;font-weight:600;color:var(--g500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--g900)}
.tab.active{color:var(--primary);border-color:var(--primary)}
.tab .cnt{min-width:22px;text-align:center;padding:1px 7px;border-radius:10px;background:var(--g100);color:var(--g600);font-size:12px;font-weight:700}
.tab.active .cnt{background:var(--primary-light);color:var(--primary)}

/* PO block */
.po{background:#fff;border:1px solid var(--g200);border-radius:12px;margin-bottom:18px;overflow:hidden}
.po-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;background:var(--g50);border-bottom:1px solid var(--g200)}
.po-head b{font-size:15px;font-weight:800}
.po-head .meta{color:var(--g500);font-size:12.5px;margin-left:10px}
.po-head .due{font-size:12.5px;color:var(--g600)}
.po-head .due b{font-size:13px;margin-left:4px}
.po-head .due.late{color:var(--danger)}

table{width:100%;border-collapse:collapse;table-layout:fixed}
td .pname,td .psub{overflow-wrap:anywhere}
th{text-align:left;font-size:11.5px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.4px;padding:10px 18px;border-bottom:1px solid var(--g200);background:#fff}
td{padding:13px 18px;border-bottom:1px solid var(--g100);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.n b{font-size:15px}
.pname{font-weight:600;color:var(--g900)}
.psub{font-size:12px;color:var(--g500);margin-top:2px}
.pend{color:var(--warning);font-weight:800}
.zero{color:var(--g300)}
tr.form-row td{background:var(--g50);padding:14px 18px}
tr.hist-row td{padding:0 18px 12px;border-bottom:1px solid var(--g100)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.none{background:var(--g100);color:var(--g500)}
.chip.prod{background:var(--warning-bg);color:var(--warning)}
.chip.ready{background:var(--primary-light);color:var(--primary)}
.chip.disp,.chip.recv{background:var(--success-bg);color:var(--success)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--primary);background:#fff;color:var(--primary);border-radius:8px;font:600 13px 'Inter';cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--primary-light)}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn:disabled{opacity:.6;cursor:wait}

.form{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
.form label{display:block;font-size:11.5px;font-weight:600;color:var(--g600);margin-bottom:5px}
.form input,.form select{width:100%;height:38px;padding:0 10px;border:1px solid var(--g300);border-radius:8px;font:14px 'Inter';background:#fff;outline:none}
.form input:focus,.form select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.form .wide{grid-column:span 2}
.form .full{grid-column:1/-1}
.form .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.err{color:var(--danger);font-size:13px}
.hist{font-size:12px;color:var(--g500);border-left:2px solid var(--g200);padding-left:10px}
.hist div{padding:2px 0}
.hist b{color:var(--g700);font-weight:600}

.empty{text-align:center;color:var(--g500);padding:56px 16px;background:#fff;border:1px dashed var(--g300);border-radius:12px}
.empty b{display:block;color:var(--g900);font-size:15px;margin-bottom:4px}
.skel{height:140px;border-radius:12px;background:linear-gradient(90deg,var(--g100) 25%,var(--g50) 50%,var(--g100) 75%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:16px}
@keyframes sk{to{background-position:-200% 0}}
footer{text-align:center;font-size:12px;color:var(--g400);padding:8px 0 28px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g900);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;display:none;z-index:10;max-width:90vw}

/* Cards (phones) — same data as the table rows */
.cards{display:none}
.card{padding:14px 16px;border-bottom:1px solid var(--g100)}
.card:last-child{border-bottom:0}
.card .row1{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0;text-align:center}
.card .nums div{background:var(--g50);border-radius:8px;padding:7px 4px}
.card .nums small{display:block;font-size:10.5px;color:var(--g500);font-weight:600;text-transform:uppercase}
.card .nums b{font-size:15px}
.card .btn{width:100%;height:40px}
.card .form{margin-top:10px;grid-template-columns:1fr}
.card .form .wide{grid-column:auto}
.card .hist{margin-top:10px}

@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
  .wrap{padding:0 14px}
  .top .wrap{height:56px;gap:10px}
  .top img{height:30px;width:30px}
  .brand b{font-size:15px}
  .tbtn{padding:0 10px}
  .tbtn .lbl{display:none}
  .page{padding-top:16px;padding-bottom:32px}
  .page-title h1{font-size:18px}
  .page-title p,.page-title .upd{display:none}
  .page-title{margin-bottom:12px}
  .kpis{gap:10px;margin-bottom:16px}
  .kpi{padding:12px;gap:10px}
  .kpi .ic{width:34px;height:34px}
  .kpi b{font-size:19px}
  .kpi span{font-size:11.5px;margin-top:3px}
  .tabs{margin-bottom:14px}
  .tab{flex:1;justify-content:center;padding:10px 4px;font-size:13px;gap:6px}
  .tab .full-l{display:none}
  .po-head{padding:12px 14px}
  .po-head .meta{display:block;margin:2px 0 0}
  table{display:none}
  .cards{display:block}
}
@media(min-width:701px){.tab .short-l{display:none}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <img src="/logo-mark.png" alt="Ajanta"/>
  <div class="brand"><b id="vName">Loading…</b><span>Ajanta Appliances · Vendor Portal</span></div>
  <button class="tbtn" onclick="load()" title="Refresh"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg><span class="lbl">Refresh</span></button>
  <button class="tbtn" onclick="logout()" title="Logout"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="lbl">Logout</span></button>
</div></div>

<div class="wrap page">
  <div class="page-title"><div><h1 id="pageH">Material to Send</h1><p id="pageP"></p></div><span class="upd" id="upd"></span></div>
  <div class="kpis" id="summary"></div>
  <div class="tabs">
    <div class="tab active" id="tabPending" onclick="setTab('pending')"><span class="full-l">Material to Send</span><span class="short-l">To Send</span><span class="cnt" id="cntPending">–</span></div>
    <div class="tab" id="tabRepl" onclick="setTab('repl')"><span class="full-l">Replacement</span><span class="short-l">Replace</span><span class="cnt" id="cntRepl">–</span></div>
    <div class="tab" id="tabReceived" onclick="setTab('received')">Received<span class="cnt" id="cntReceived">–</span></div>
  </div>
  <div id="list"><div class="skel"></div><div class="skel"></div></div>
  <footer>Koi sawaal ho to Ajanta Appliances purchase team se sampark karein.</footer>
</div>
<div id="toast"></div>
<script>
let DATA = null, TAB = 'pending', OPEN = null, ROPEN = null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dmy = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
const num = v => Number(v) || 0;
const nfmt = v => num(v).toLocaleString('en-IN');
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 3500); }
function todayYmd() { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; }
const ICON = {
  po: '<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>',
  box: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  truck: '<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  repl: '<path d="M4 9a8 8 0 0 1 14-3l2 2"/><path d="M20 4v4h-4"/><path d="M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M4 20v-4h4"/>'
};
const ic = k => `<svg class="i" viewBox="0 0 24 24">${ICON[k]}</svg>`;

async function api(url, method = 'GET', body) {
  const opts = { method, credentials: 'include', headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  let r;
  try { r = await fetch(url, opts); } catch (e) { return { error: 'Network error — check your internet' }; }
  if (r.status === 401) { location.replace('/'); return {}; }
  try { const d = await r.json(); if (!r.ok && !d.error) d.error = 'HTTP ' + r.status; return d; }
  catch (e) { return { error: 'HTTP ' + r.status }; }
}
async function init() {
  const me = await api('/api/me');
  if (me && me.role && me.role !== 'vendor') { location.replace('/app'); return; }
  await load();
}
async function load() {
  if (!DATA) document.getElementById('list').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  const d = await api('/api/vendor/items');
  if (d.error) { document.getElementById('list').innerHTML = `<div class="empty"><b>Data load nahi hua</b>${esc(d.error)}</div>`; return; }
  DATA = d;
  document.getElementById('vName').textContent = d.vendor;
  document.getElementById('upd').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  render();
}
function setTab(t) {
  TAB = t; OPEN = null; ROPEN = null;
  document.getElementById('tabPending').classList.toggle('active', t === 'pending');
  document.getElementById('tabRepl').classList.toggle('active', t === 'repl');
  document.getElementById('tabReceived').classList.toggle('active', t === 'received');
  render();
}
const openRepl = () => (DATA.replacements || []).filter(c => c.lines.some(l => l.pending > 0));
const HEAD = {
  pending: ['Material to Send', 'Har item ka status update karein — production me hai, ready hai, ya dispatch kar diya (qty + date).'],
  repl: ['Replacement pending', 'Ajanta ne ye maal replacement / repair ke liye bheja hai. Har item par batayein ki aapki taraf se kya hua.'],
  received: ['Received', 'Ye PO Ajanta Appliances ko poore mil chuke hain.']
};
function renderSummary() {
  const pend = (DATA.pending || []).flatMap(po => po.items.filter(i => !i.received));
  const owed = pend.reduce((a, i) => a + num(i.pendingQty), 0);
  const transit = pend.filter(i => num(i.dispatchedQty) > num(i.receivedQty)).length;
  const repl = openRepl().flatMap(c => c.lines).reduce((a, l) => a + num(l.pending), 0);
  const k = (icon, bg, color, n, l) => `<div class="kpi"><div class="ic" style="background:${bg};color:${color}">${ic(icon)}</div><div><b>${n}</b><span>${l}</span></div></div>`;
  document.getElementById('summary').innerHTML =
    k('po', 'var(--primary-light)', 'var(--primary)', (DATA.pending || []).length, 'Open purchase orders') +
    k('box', 'var(--warning-bg)', 'var(--warning)', nfmt(owed), 'Qty abhi bhejni hai') +
    k('truck', '#e0f2fe', '#0369a1', transit, 'Item raste me') +
    k('repl', 'var(--danger-bg)', 'var(--danger)', nfmt(repl), 'Replacement qty pending');
  document.getElementById('cntPending').textContent = (DATA.pending || []).length;
  document.getElementById('cntRepl').textContent = openRepl().length;
  document.getElementById('cntReceived').textContent = (DATA.received || []).length;
}
function chip(item) {
  if (item.received) return '<span class="chip recv">Received</span>';
  const u = item.updates[0];
  if (!u) return '<span class="chip none">No update</span>';
  const cls = { 'In Production': 'prod', 'Ready to Dispatch': 'ready', 'Dispatched': 'disp' }[u.status] || 'none';
  const extra = u.status === 'Dispatched' ? ` · ${dmy(u.update_date)}` : (u.update_date ? ` · by ${dmy(u.update_date)}` : '');
  return `<span class="chip ${cls}">${esc(u.status)}${esc(extra)}</span>`;
}
const cell = v => num(v) ? `<b>${nfmt(v)}</b>` : '<span class="zero">0</span>';
function histHtml(list, fmt) { return list.length ? `<div class="hist">${list.slice(0, 5).map(fmt).join('')}</div>` : ''; }
function poHist(u) { return `<div>${esc(u.created_at.slice(8, 10) + '/' + u.created_at.slice(5, 7))} ${esc(u.created_at.slice(11))} — <b>${esc(u.status)}</b>${u.status === 'Dispatched' ? ' ' + num(u.dispatched_qty) : ''}${u.update_date ? ' · ' + esc(dmy(u.update_date)) : ''}${u.remark ? ' · ' + esc(u.remark) : ''}</div>`; }

function render() {
  if (!DATA) return;
  renderSummary();
  document.getElementById('pageH').textContent = HEAD[TAB][0];
  document.getElementById('pageP').textContent = HEAD[TAB][1];
  if (TAB === 'repl') return renderRepl();
  const list = document.getElementById('list');
  const pos = DATA[TAB] || [];
  if (!pos.length) {
    list.innerHTML = `<div class="empty"><b>${TAB === 'pending' ? 'Sab bhej diya 🎉' : 'Abhi kuch nahi'}</b>${TAB === 'pending' ? 'Abhi aapki taraf se koi maal pending nahi.' : 'Abhi tak koi PO poora receive nahi hua.'}</div>`;
    return;
  }
  const today = todayYmd(), editable = TAB === 'pending';
  list.innerHTML = pos.map(po => {
    const items = po.items.filter(it => TAB === 'received' || !it.received);
    const late = editable && po.expectedBy && po.expectedBy.slice(0, 10) < today;
    const rows = items.map(it => {
      const key = `${po.poNumber}|${it.itemId}`, open = OPEN === key;
      return `<tr><td><div class="pname">${esc(it.productName)}</div><div class="psub">${esc(it.uom || '')}</div></td>
        <td class="n"><b>${nfmt(it.qty)}</b></td><td class="n">${cell(it.dispatchedQty)}</td><td class="n">${cell(it.receivedQty)}</td>
        <td class="n">${it.received ? '<span class="zero">—</span>' : `<span class="pend">${nfmt(it.pendingQty)}</span>`}</td>
        <td>${chip(it)}</td>
        <td style="text-align:right">${editable && !it.received && !open ? `<button class="btn" onclick="openForm('${esc(key)}')">Update</button>` : ''}</td></tr>
        ${open ? `<tr class="form-row"><td colspan="7">${formHtml(po, it)}</td></tr>` : ''}
        ${it.updates.length ? `<tr class="hist-row"><td colspan="7">${histHtml(it.updates, poHist)}</td></tr>` : ''}`;
    }).join('');
    const cards = items.map(it => {
      const key = `${po.poNumber}|${it.itemId}`, open = OPEN === key;
      return `<div class="card"><div class="row1"><div><div class="pname">${esc(it.productName)}</div><div class="psub">${esc(it.uom || '')}</div></div>${chip(it)}</div>
        <div class="nums"><div><small>Order</small><b>${nfmt(it.qty)}</b></div><div><small>Bheja</small><b>${nfmt(it.dispatchedQty)}</b></div><div><small>Mila</small><b>${nfmt(it.receivedQty)}</b></div><div><small>Pending</small><b class="pend">${it.received ? 0 : nfmt(it.pendingQty)}</b></div></div>
        ${editable && !it.received && !open ? `<button class="btn" onclick="openForm('${esc(key)}')">Update Status</button>` : ''}
        ${open ? formHtml(po, it) : ''}${histHtml(it.updates, poHist)}</div>`;
    }).join('');
    return `<div class="po"><div class="po-head"><div><b>${esc(po.poNumber)}</b><span class="meta">PO date ${esc(dmy(po.poDate) || '—')}${po.indentNo ? ' · ' + esc(po.indentNo) : ''}</span></div>
        ${po.expectedBy ? `<div class="due${late ? ' late' : ''}">${late ? 'Late — expected' : 'Expected by'}<b>${esc(dmy(po.expectedBy))}</b></div>` : ''}</div>
      <table><colgroup><col/><col style="width:110px"/><col style="width:100px"/><col style="width:100px"/><col style="width:110px"/><col style="width:210px"/><col style="width:110px"/></colgroup><thead><tr><th>Product</th><th class="n">Ordered</th><th class="n">Bheja</th><th class="n">Mila</th><th class="n">Pending</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <div class="cards">${cards}</div></div>`;
  }).join('');
  if (OPEN) onStatus();
}
// The open form is drawn twice (table + phone cards, one hidden) — read the visible one.
function vis(id) { return [...document.querySelectorAll(`[id="${id}"]`)].find(el => el.offsetParent !== null) || document.getElementById(id); }
function formHtml(po, it) {
  return `<div class="form">
    <div><label>Status</label>
      <select id="fStatus" onchange="onStatus()"><option value="In Production">In Production</option><option value="Ready to Dispatch">Ready to Dispatch</option><option value="Dispatched">Dispatched</option></select></div>
    <div><label><span id="fDateLabel">Expected dispatch date</span> <span id="fDateDmy" style="color:var(--primary)"></span></label><input type="date" id="fDate" oninput="showDmy()" onchange="showDmy()"/></div>
    <div id="fQtyWrap" style="display:none"><label>Dispatched qty</label><input type="number" id="fQty" min="1" placeholder="${esc(it.pendingQty || it.qty)}"/></div>
    <div class="wide"><label>Remark (vehicle / LR no.)</label><input type="text" id="fRemark" maxlength="400"/></div>
    <div class="err full" id="fErr" style="display:none"></div>
    <div class="actions"><button class="btn" onclick="closeForm()">Cancel</button><button class="btn primary" id="fSave" onclick="save('${esc(po.poNumber)}','${esc(it.itemId)}')">Save update</button></div>
  </div>`;
}
// Phones show the native date box in their own locale (often MM/DD) — echo
// the picked date as DD/MM/YYYY next to the label.
function showDmy() { const v = vis('fDate').value; vis('fDateDmy').textContent = v ? '(' + dmy(v) + ')' : ''; }
function openForm(key) { OPEN = key; render(); }
function closeForm() { OPEN = null; render(); }
function onStatus() {
  const st = vis('fStatus');
  if (!st) return;
  const disp = st.value === 'Dispatched';
  vis('fQtyWrap').style.display = disp ? '' : 'none';
  vis('fDateLabel').textContent = disp ? 'Dispatch date' : 'Expected dispatch date';
  const d = vis('fDate');
  if (disp && !d.value) d.value = todayYmd();
  showDmy();
}
async function save(poNumber, itemId) {
  const err = vis('fErr'), btn = vis('fSave');
  const body = { poNumber, itemId, status: vis('fStatus').value, date: vis('fDate').value, dispatchedQty: vis('fQty').value, remark: vis('fRemark').value };
  if (body.status === 'Dispatched' && !(Number(body.dispatchedQty) > 0)) { err.textContent = 'Dispatched quantity likhein'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  const r = await api('/api/vendor/update', 'POST', body);
  btn.disabled = false; btn.textContent = 'Save update';
  if (r.error) { err.textContent = r.error; err.style.display = 'block'; return; }
  OPEN = null;
  toast('Status update ho gaya — Ajanta Appliances ko dikh raha hai');
  await load();
}

// ── Replacement: goods Ajanta sent back to this vendor ──
const R_STATUSES = ['Repair me hai', 'Naya maal bheja', 'Repair karke bheja', 'Credit note diya'];
function rChip(l) { const u = l.updates[0]; return u ? `<span class="chip ready">${esc(u.status)}${u.qty ? ' · ' + num(u.qty) : ''}</span>` : '<span class="chip none">No update</span>'; }
function rForm(l) {
  return `<div class="form"><div><label>Status</label><select id="rStatus">${R_STATUSES.map(x => `<option>${x}</option>`).join('')}</select></div>
    <div><label>Qty</label><input type="number" id="rQty" min="1" max="${l.pending}" value="${l.pending}"/></div>
    <div><label>Date</label><input type="date" id="rDate" value="${todayYmd()}"/></div>
    <div><label>Credit note no. (agar diya)</label><input id="rCn"/></div>
    <div class="full"><label>Remark (LR no. / vehicle)</label><input id="rRemark" maxlength="400"/></div>
    <div class="err full" id="rErr" style="display:none"></div>
    <div class="actions"><button class="btn" onclick="ROPEN=null;render()">Cancel</button><button class="btn primary" id="rSave" onclick="saveRepl(${l.id})">Save update</button></div></div>`;
}
function rHist(u) { return `<div>${esc(u.created_at.slice(8, 10) + '/' + u.created_at.slice(5, 7))} — <b>${esc(u.status)}</b>${u.qty ? ' ' + num(u.qty) : ''}${u.cn_no ? ' · CN ' + esc(u.cn_no) : ''}${u.remark ? ' · ' + esc(u.remark) : ''}</div>`; }
function renderRepl() {
  const list = document.getElementById('list');
  const ch = openRepl();
  if (!ch.length) { list.innerHTML = '<div class="empty"><b>Sab clear 🎉</b>Koi replacement pending nahi.</div>'; return; }
  list.innerHTML = ch.map(c => {
    const lines = c.lines.filter(l => l.pending > 0);
    const rows = lines.map(l => `<tr><td><div class="pname">${esc(l.itemName)}</div><div class="psub">${l.serialNo ? 'S/N ' + esc(l.serialNo) + ' · ' : ''}${esc(l.defect || '')}</div></td>
        <td class="n"><b>${nfmt(l.qty)}</b></td><td class="n">${cell(l.qty - l.pending)}</td><td class="n"><span class="pend" style="color:var(--danger)">${nfmt(l.pending)}</span></td>
        <td>${rChip(l)}</td><td style="text-align:right">${ROPEN !== l.id ? `<button class="btn" onclick="ROPEN=${l.id};render()">Update</button>` : ''}</td></tr>
        ${ROPEN === l.id ? `<tr class="form-row"><td colspan="6">${rForm(l)}</td></tr>` : ''}
        ${l.updates.length ? `<tr class="hist-row"><td colspan="6">${histHtml(l.updates, rHist)}</td></tr>` : ''}`).join('');
    const cards = lines.map(l => `<div class="card"><div class="row1"><div><div class="pname">${esc(l.itemName)}</div><div class="psub">${l.serialNo ? 'S/N ' + esc(l.serialNo) + ' · ' : ''}${esc(l.defect || '')}</div></div>${rChip(l)}</div>
        <div class="nums" style="grid-template-columns:repeat(3,1fr)"><div><small>Bheja tha</small><b>${nfmt(l.qty)}</b></div><div><small>Settle</small><b>${nfmt(l.qty - l.pending)}</b></div><div><small>Pending</small><b style="color:var(--danger)">${nfmt(l.pending)}</b></div></div>
        ${ROPEN !== l.id ? `<button class="btn" onclick="ROPEN=${l.id};render()">Update</button>` : rForm(l)}${histHtml(l.updates, rHist)}</div>`).join('');
    return `<div class="po"><div class="po-head"><div><b>${esc(c.code)}</b><span class="meta">Challan ${esc(dmy(c.date))}${c.billNo ? ' · Bill ' + esc(c.billNo) : ''}${c.reason ? ' · ' + esc(c.reason) : ''}</span></div>
        <div class="due${c.days > 30 ? ' late' : ''}">Pending since<b>${c.days} din</b></div></div>
      <table><colgroup><col/><col style="width:120px"/><col style="width:110px"/><col style="width:110px"/><col style="width:210px"/><col style="width:110px"/></colgroup><thead><tr><th>Item</th><th class="n">Bheja tha</th><th class="n">Settle</th><th class="n">Pending</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <div class="cards">${cards}</div></div>`;
  }).join('');
}
async function saveRepl(lineId) {
  const err = vis('rErr'), btn = vis('rSave');
  const body = { lineId, status: vis('rStatus').value, qty: vis('rQty').value, date: vis('rDate').value, cnNo: vis('rCn').value, remark: vis('rRemark').value };
  btn.disabled = true; btn.textContent = 'Saving…';
  const r = await api('/api/vendor/replacement-update', 'POST', body);
  btn.disabled = false; btn.textContent = 'Save update';
  if (r.error) { err.textContent = r.error; err.style.display = 'block'; return; }
  ROPEN = null;
  toast('Update save ho gaya — Ajanta Appliances ko dikh raha hai');
  await load();
}
async function logout() {
  await fetch('/api/logout', { method: 'POST', credentials: 'include' }).catch(() => {});
  location.replace('/');
}
init();
</script>
</body>
</html>
