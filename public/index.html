<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ajanta Electronics Task Manager</title>
<link rel="icon" type="image/svg+xml" href="/logo-mark.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Inter',sans-serif;
    background:#eef1ff;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }

  /* ── Floating gradient blobs ── */
  .blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;}
  .b1{width:700px;height:700px;top:-220px;left:-180px;
      background:radial-gradient(circle,rgba(99,102,241,.2),rgba(79,70,229,.06),transparent 68%);
      animation:bf1 14s ease-in-out infinite;}
  .b2{width:560px;height:560px;bottom:-180px;right:-140px;
      background:radial-gradient(circle,rgba(124,58,237,.16),rgba(167,139,250,.05),transparent 68%);
      animation:bf2 18s ease-in-out infinite;}
  .b3{width:340px;height:340px;top:45%;left:55%;
      background:radial-gradient(circle,rgba(6,182,212,.12),transparent 68%);
      animation:bf3 11s ease-in-out infinite;}
  @keyframes bf1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(45px,35px) scale(1.06)}}
  @keyframes bf2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-35px,-45px) scale(1.09)}}
  @keyframes bf3{0%,100%{transform:translate(0,0)}50%{transform:translate(-25px,35px)}}

  /* ── Card ── */
  .login-wrap{
    background:#fff;
    border-radius:28px;
    width:460px;max-width:95vw;
    box-shadow:0 32px 80px rgba(79,70,229,.16),0 0 0 1px rgba(79,70,229,.08);
    position:relative;z-index:1;overflow:hidden;
    animation:cardIn .7s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(44px) scale(.94);}
    to  {opacity:1;transform:translateY(0)    scale(1);}
  }

  /* Rainbow top accent */
  .login-wrap::before{
    content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,#4f46e5,#7c3aed,#06b6d4,#10b981);
    border-radius:28px 28px 0 0;
  }

  /* ── Logo area ── */
  .login-header{
    padding:44px 44px 26px;
    text-align:center;
    background:linear-gradient(180deg,#f8f9ff 0%,#fff 100%);
    border-bottom:1px solid #eef2ff;
  }

  .logo-img-wrap{
    display:inline-block;position:relative;margin-bottom:14px;
    animation:logoIn .7s ease .2s both;
  }
  @keyframes logoIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}

  .logo-img-wrap img{
    width:120px;display:block;
    filter:drop-shadow(0 5px 14px rgba(79,70,229,.2));
    animation:logoFloat 4s ease-in-out 1.2s infinite;
  }
  @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  .logo-img-wrap::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.85) 50%,transparent 70%);
    animation:shimmer 2.8s ease .9s 2;
  }
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}

  .logo-tagline{
    font-size:10px;font-weight:800;letter-spacing:3.5px;
    color:#6366f1;text-transform:uppercase;margin-bottom:10px;
  }
  .logo-dots{display:flex;gap:5px;justify-content:center;}
  .logo-dots span{width:4px;height:4px;border-radius:50%;}
  .logo-dots span:nth-child(1){background:#4f46e5;animation:dotPop .4s ease 1.2s both;}
  .logo-dots span:nth-child(2){background:#7c3aed;animation:dotPop .4s ease 1.38s both;}
  .logo-dots span:nth-child(3){background:#06b6d4;animation:dotPop .4s ease 1.56s both;}
  @keyframes dotPop{0%{opacity:0;transform:scale(0)}70%{transform:scale(1.6)}100%{opacity:1;transform:scale(1)}}

  /* ── Form body ── */
  .login-body{padding:30px 44px 40px;}

  h2{font-size:22px;font-weight:800;color:#0f172a;margin-bottom:4px;letter-spacing:-.4px;}
  p.sub{font-size:14px;color:#64748b;margin-bottom:28px;font-weight:400;}

  .form-group{margin-bottom:18px;}
  label{
    font-size:10px;font-weight:800;color:#475569;
    display:block;margin-bottom:7px;
    text-transform:uppercase;letter-spacing:.6px;
  }

  .input-wrap{position:relative;}
  .input-wrap .icon{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    font-size:15px;color:#c4b5fd;pointer-events:none;transition:color .2s;
  }
  .input-wrap:focus-within .icon{color:#6366f1;}

  input{
    width:100%;padding:13px 14px 13px 43px;
    border:1.5px solid #e8ecf8;border-radius:12px;
    font-size:14px;font-family:'Inter',sans-serif;
    outline:none;transition:all .2s;
    color:#0f172a;background:#fafbff;font-weight:500;
  }
  input:focus{
    border-color:#6366f1;
    box-shadow:0 0 0 4px rgba(99,102,241,.1);
    background:#fff;
  }
  input::placeholder{color:#c4cbdc;font-weight:400;}

  .btn-login{
    width:100%;padding:14px;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:#fff;border:none;border-radius:12px;
    font-size:15px;font-weight:700;font-family:'Inter',sans-serif;
    cursor:pointer;transition:all .22s;margin-top:8px;
    letter-spacing:.2px;
    box-shadow:0 6px 24px rgba(79,70,229,.38);
    position:relative;overflow:hidden;
  }
  .btn-login::after{
    content:'';position:absolute;inset:0;
    background:rgba(255,255,255,0);transition:background .22s;
  }
  .btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 34px rgba(79,70,229,.48);}
  .btn-login:hover::after{background:rgba(255,255,255,.09);}
  .btn-login:active{transform:translateY(0);}

  .error{
    background:#fef2f2;border:1.5px solid #fecaca;
    color:#dc2626;padding:11px 14px;border-radius:10px;
    font-size:13px;margin-bottom:18px;display:none;font-weight:500;
  }

  .footer-text{
    text-align:center;font-size:11px;color:#c4cbdc;margin-top:22px;
  }
  .footer-text strong{color:#a5b4fc;font-weight:600;}

  /* ── Eye toggle ── */
  .eye-btn{
    position:absolute;right:11px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;padding:5px;
    color:#c4cbdc;display:flex;align-items:center;justify-content:center;
    border-radius:7px;transition:all .18s;
  }
  .eye-btn:hover{color:#6366f1;background:rgba(99,102,241,.09);}
  .eye-btn svg{display:block;}
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="login-wrap">

  <!-- Logo -->
  <div class="login-header">
    <div class="logo-img-wrap">
      <div style="display:flex;width:100%;height:62px;align-items:center;justify-content:center">
        <img src="logo.svg" alt="Ajanta Electronics" style="height:100%"/>
      </div>
    </div>
    <div class="logo-tagline">Task Manager</div>
    <div class="logo-dots"><span></span><span></span><span></span></div>
  </div>

  <!-- Form -->
  <div class="login-body">
    <h2>Welcome back 👋</h2>
    <p class="sub">Sign in to continue to your workspace</p>

    <div class="error" id="err"></div>

    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <span class="icon">✉</span>
        <input type="email" id="email" placeholder="you@example.com"/>
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <span class="icon">🔒</span>
        <input type="password" id="password" placeholder="Enter your password"
               onkeydown="if(event.key==='Enter')login()" style="padding-right:42px"/>
        <button type="button" class="eye-btn" onclick="togglePassword()" id="eyeBtn" title="Show/hide password">
          <svg id="eyeIconShow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeIconHide" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>

    <button class="btn-login" onclick="login()">Sign In →</button>

    <div class="footer-text">
      <strong>Ajanta Electronics Task Manager</strong>
    </div>
  </div>
</div>

<script>
function togglePassword(){
  const inp=document.getElementById('password');
  const show=document.getElementById('eyeIconShow');
  const hide=document.getElementById('eyeIconHide');
  if(inp.type==='password'){inp.type='text';show.style.display='none';hide.style.display='block';}
  else{inp.type='password';show.style.display='block';hide.style.display='none';}
}

(async function checkExistingSession(){
  try{const r=await fetch('/api/me',{credentials:'include'});if(r.ok){window.location.replace('/app');}}catch(e){}
})();

async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('err');
  err.style.display='none';
  if(!email||!password){err.textContent='Please fill all fields';err.style.display='block';return;}
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email,password})});
    const d=await r.json();
    if(!r.ok){err.textContent=d.error||'Login failed';err.style.display='block';return;}
    if(d.token)localStorage.setItem('authToken',d.token);
    window.location.replace('/app');
  }catch(e){err.textContent='Server error. Try again.';err.style.display='block';}
}
</script>
</body>
</html>
