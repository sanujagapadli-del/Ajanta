<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#010371">
<title>Internet nahi hai · Ajanta ERP</title>
<style>
  :root{--navy:#010371;--red:#D80700;--bg:#f4f6fb;--text:#1e293b;--muted:#64748b;--card:#fff;}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1020;--text:#e2e8f0;--muted:#94a3b8;--card:#141a2e;}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);}
  .card{max-width:380px;width:100%;background:var(--card);border-radius:18px;padding:28px 22px;text-align:center;
    box-shadow:0 12px 40px -12px rgba(15,23,42,.25);}
  .ico{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(216,7,0,.08);color:var(--red);}
  h1{font-size:20px;margin:0 0 8px}
  p{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 20px}
  button{min-height:46px;width:100%;border:none;border-radius:12px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  button:active{transform:scale(.98)}
</style>
</head>
<body>
  <div class="card">
    <div class="ico" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="M12 20h.01"/></svg>
    </div>
    <h1>Internet nahi hai</h1>
    <p>Phone ka data / WiFi check karein. Internet aate hi neeche button dabayein — aapka login safe hai.</p>
    <button type="button" onclick="location.reload()">Dobara try karein</button>
  </div>
</body>
</html>
